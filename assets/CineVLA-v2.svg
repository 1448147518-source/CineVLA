<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">CineVLA RGB-only architecture</title><desc id="desc">Causal RGB perception, language-conditioned planning, and visual feedback trajectory refinement.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#51617a"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#1677d2"/></marker><style>.t{font:700 28px Arial,sans-serif;fill:#172033}.h{font:700 17px Arial,sans-serif;fill:#172033}.l{font:600 15px Arial,sans-serif;fill:#26354d}.s{font:400 13px Arial,sans-serif;fill:#5d6b82}.box{stroke-width:1.5;rx:14}.f{fill:none;stroke:#51617a;stroke-width:2;marker-end:url(#a)}.fb{fill:none;stroke:#1677d2;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#b)}</style></defs>
<rect width="1440" height="820" fill="#f8fafc"/><text x="55" y="55" class="t">CineVLA: RGB-only Visual-Language Camera Trajectory Generation</text><text x="55" y="81" class="s">Offline pose and latent supervision; online rollout observes only the current and historical RGB frames.</text>
<rect x="45" y="115" width="1350" height="275" rx="18" fill="#fff" stroke="#d8e1ef"/><text x="70" y="148" class="h">1. Initial plan — causal perception + language</text>
<rect x="80" y="190" width="170" height="110" class="box" fill="#e9f4ff" stroke="#80bfff"/><text x="109" y="226" class="l">RGB history</text><text x="109" y="251" class="s">I₀ … Iₜ</text><text x="109" y="276" class="s">no audio / depth</text>
<rect x="320" y="180" width="260" height="130" class="box" fill="#eef8f0" stroke="#7bc98a"/><text x="350" y="218" class="l">Video Perception Encoder</text><text x="350" y="244" class="s">frozen CLIP ViT-B/32</text><text x="350" y="267" class="s">+ causal temporal Transformer</text><text x="350" y="290" class="s">z₀, zₜ, temporal features</text>
<rect x="650" y="190" width="160" height="110" class="box" fill="#fff4e6" stroke="#f0a54a"/><text x="679" y="226" class="l">Text prompt</text><text x="679" y="251" class="s">director intent</text><text x="679" y="276" class="s">frozen CLIP text</text>
<rect x="880" y="180" width="255" height="130" class="box" fill="#f3edff" stroke="#a98ce8"/><text x="914" y="218" class="l">Trajectory Planner</text><text x="914" y="244" class="s">causal decoder + text cross-attn</text><text x="914" y="267" class="s">first-frame visual context</text><text x="914" y="290" class="s">unit quaternion output</text>
<rect x="1205" y="190" width="145" height="110" class="box" fill="#eaf8f8" stroke="#54b6b2"/><text x="1225" y="226" class="l">Initial plan</text><text x="1225" y="251" class="s">P̂₁:N</text><text x="1225" y="276" class="s">N × [q, t]</text>
<path class="f" d="M250 245H320"/><path class="f" d="M580 245H880"/><path class="f" d="M810 245H880"/><path class="f" d="M1135 245H1205"/>
<rect x="45" y="425" width="1350" height="310" rx="18" fill="#fff" stroke="#d8e1ef"/><text x="70" y="458" class="h">2. Visual feedback refinement — action-conditioned at deployment</text>
<rect x="80" y="510" width="185" height="125" class="box" fill="#e9f4ff" stroke="#80bfff"/><text x="104" y="546" class="l">Current observation</text><text x="104" y="572" class="s">Iₜ → zₜ</text><text x="104" y="596" class="s">causal history state</text><text x="104" y="617" class="s">offline: replay frames</text>
<rect x="340" y="510" width="180" height="125" class="box" fill="#fff5f5" stroke="#ee9292"/><text x="368" y="546" class="l">Perception error</text><text x="368" y="572" class="s">zₜ − ẑₜ</text><text x="368" y="596" class="s">real vs predicted</text>
<rect x="595" y="495" width="295" height="155" class="box" fill="#f3edff" stroke="#a98ce8"/><text x="654" y="532" class="l">Trajectory Refiner</text><text x="654" y="558" class="s">error token + remaining poses</text><text x="654" y="581" class="s">Transformer + text cross-attn</text><text x="654" y="605" class="s">P̃ₜ₊₁:N and ẑₜ₊₁</text><text x="654" y="628" class="s">unit quaternion output</text>
<rect x="965" y="510" width="180" height="125" class="box" fill="#eaf8f8" stroke="#54b6b2"/><text x="992" y="546" class="l">Execute next pose</text><text x="992" y="572" class="s">P̃ₜ₊₁</text><text x="992" y="596" class="s">camera / renderer</text>
<rect x="1220" y="510" width="130" height="125" class="box" fill="#eef8f0" stroke="#7bc98a"/><text x="1237" y="546" class="l">New RGB</text><text x="1237" y="572" class="s">Iₜ₊₁</text><text x="1237" y="596" class="s">append history</text>
<path class="f" d="M265 572H340"/><path class="f" d="M520 572H595"/><path class="f" d="M890 572H965"/><path class="f" d="M1145 572H1220"/><path class="fb" d="M1285 510V475H172V510"/><text x="600" y="490" class="s" fill="#1677d2">execute → observe → refine</text><path class="fb" d="M1280 635V690H747V650"/>
<rect x="45" y="760" width="1350" height="42" rx="12" fill="#172b4d"/><text x="72" y="787" font-family="Arial,sans-serif" font-size="14" fill="#fff">Training: planner = rotation geodesic + translation L1 + relative pose + smoothness; refiner = corrected pose + next-latent MSE + geometric regularizers.</text>
</svg>
